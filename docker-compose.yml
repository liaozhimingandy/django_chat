version: '3.7'

services:
  chat:
    image: ${CHAT_APP_IMAGE}
#    for producation,请注释command行即可
#    for beta
#    command: python manage.py runserver 0.0.0.0:8000
#    for production
#    command: gunicorn django_hip_service.wsgi:application -b 0.0.0.0:8000 --preload
    # 生产环境中请使用自动重启; always
    restart: unless-stopped
    ports:
       - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - data_static:/opt/app/static

  web:
      image: ${NGINX_APP_IMAGE}
      restart: unless-stopped
      links:
        - chat:app
      ports:
        - "80:80"
        - "443:443"
      env_file:
        - .env
      environment:
        - TZ=Asia/Shanghai
      volumes:
        - ./config/default.conf.template:/etc/nginx/templates/default.conf.template
        - data_nginx_log:/var/log/nginx
        - data_static:/usr/share/nginx/static

volumes:
  data_nginx_log:
    driver: local
  data_static:
    driver: local